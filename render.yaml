version: "1"
projects:
  - name: vendor-registration-springboot
    environments:
      - name: Production
        services:
          - type: redis
            name: vendor-redis
            plan: free
            region: singapore
          - type: web
            name: vendor-registration-springboot
            runtime: docker
            repo: https://github.com/Devanand-Rai283/vendor-registration-springboot
            plan: free
            envVars:
              - key: APP_ENV
                value: production
              - key: SPRING_DATASOURCE_USERNAME
                fromDatabase:
                  name: vendor-db
                  property: user
              - key: SPRING_DATASOURCE_URL
                fromDatabase:
                  name: vendor-db
                  property: connectionString
              - key: SPRING_DATASOURCE_PASSWORD
                fromDatabase:
                  name: vendor-db
                  property: password
              - key: REDIS_HOST
                fromService:
                  type: redis
                  name: vendor-redis
                  property: host
              - key: REDIS_PORT
                fromService:
                  type: redis
                  name: vendor-redis
                  property: port
              - key: REDIS_PASSWORD
                sync: false
              - key: JWT_SECRET
                sync: false
              - key: ADMIN_EMAIL
                sync: false
              - key: ADMIN_PASSWORD
                sync: false
              - key: RAZORPAY_KEY_ID
                value: rzp_test_T36d2j5DWTHQDE
              - key: RAZORPAY_KEY_SECRET
                sync: false
              - key: RAZORPAY_WEBHOOK_SECRET
                sync: false
              - key: R2_ACCESS_KEY
                sync: false
              - key: R2_SECRET_KEY
                sync: false
              - key: R2_BUCKET_NAME
                value: streetvendor-files
              - key: R2_ENDPOINT
                sync: false
              - key: CORS_ALLOWED_ORIGINS
                value: https://streetvendor-frontend.onrender.com
              - key: spring.jpa.hibernate.ddl-auto
                value: validate
            region: singapore
            dockerContext: .
            dockerfilePath: ./Dockerfile
            autoDeployTrigger: commit
          - type: web
            name: streetvendor-frontend
            runtime: docker
            repo: https://github.com/Devanand-Rai283/vendor-registration-springboot
            plan: free
            branch: main
            envVars:
              - key: NEXT_PUBLIC_API_URL
                value: https://vendor-registration-springboot.onrender.com/api
              - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
                value: rzp_test_T36d2j5DWTHQDE
            region: singapore
            dockerContext: ./frontend
            dockerfilePath: ./Dockerfile
            autoDeployTrigger: commit
        databases:
          - name: vendor-db
            databaseName: vendor_db_atlv
            user: vendordb_seec_user
            plan: free
            region: singapore
            postgresMajorVersion: "18"