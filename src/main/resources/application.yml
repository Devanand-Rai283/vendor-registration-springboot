spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ping-on-startup: false

account:
  lock:
    threshold: ${ACCOUNT_LOCK_THRESHOLD:5}
    duration-minutes: ${ACCOUNT_LOCK_DURATION_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: db,redis
          show-details: never
  health:
    redis:
      enabled: true

discovery:
  cache:
    vendor-search-ttl: 600
    vendor-menu-ttl: 900

analytics:
  cron-expression: ${ANALYTICS_CRON_EXPRESSION:0 0 1 * * *}
  timezone: ${ANALYTICS_TIMEZONE:UTC}

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
  tolerance-seconds: ${RAZORPAY_WEBHOOK_TOLERANCE_SECONDS:300}