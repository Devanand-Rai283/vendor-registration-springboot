spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ping-on-startup: false

management:
  health:
    redis:
      enabled: true
  endpoint:
    health:
      show-details: always

discovery:
  cache:
    vendor-search-ttl: 600
    vendor-menu-ttl: 900

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
  tolerance-seconds: ${RAZORPAY_WEBHOOK_TOLERANCE_SECONDS:300}