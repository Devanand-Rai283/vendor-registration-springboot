spring:
  datasource:
    url: jdbc:tc:postgresql:16:///testdb
    username: test
    password: test
  data:
    redis:
      host: localhost
      port: 6379
      ping-on-startup: false
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

account:
  lock:
    threshold: 5
    duration-minutes: 1

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui/index.html

razorpay:
  key-id: test-razorpay-key-id
  key-secret: test-razorpay-key-secret
  webhook-secret: test-webhook-secret
