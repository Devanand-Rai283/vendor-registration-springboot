name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Give permission to mvnw
        run: chmod +x mvnw

      - name: Build and Verify with Maven
        # Run clean verify to avoid duplicate execution and enable verbose diagnostics
        run: ./mvnw clean verify -e -X -DtrimStackTrace=false

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

      - name: Print Test Report Contents
        if: failure()
        run: |
          echo "=== Printing Surefire and Failsafe Reports ==="
          for dir in target/surefire-reports target/failsafe-reports; do
            if [ -d "$dir" ]; then
              echo "Searching $dir..."
              find "$dir" \( -name "*.txt" -o -name "*.xml" \) -print | while read -r file; do
                echo "--- $file ---"
                cat "$file"
              done
            else
              echo "Directory $dir does not exist, skipping."
            fi
          done


  deploy:
    needs: build   # runs only if build succeeds
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}