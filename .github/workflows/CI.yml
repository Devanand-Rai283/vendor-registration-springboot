name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:

  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Give permission to mvnw
        run: chmod +x mvnw

      - name: Backend Tests
        run: ./mvnw clean test -B -e -DtrimStackTrace=false

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Build
        working-directory: ./frontend
        run: npm run build

      - name: Build Backend Docker Image
        run: docker build -t streetvendor-backend .

      - name: Build Frontend Docker Image
        run: docker build -t streetvendor-frontend ./frontend

  deploy:
    needs: build-and-verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Backend Render Deployment
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}

      - name: Trigger Frontend Render Deployment
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}

      - name: Health Verification
        run: |
          echo "Waiting for deployments to trigger and stabilize..."
          sleep 60
          echo "Checking Backend Health..."
          curl --fail --silent https://vendor-registration-springboot.onrender.com/actuator/health
          echo "Checking Backend Readiness..."
          curl --fail --silent https://vendor-registration-springboot.onrender.com/actuator/health/readiness
          echo "Checking Frontend..."
          curl --fail --silent https://streetvendor-frontend.onrender.com/